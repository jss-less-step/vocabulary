<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词汇列表</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 40px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .back-btn:hover {
      transform: translateY(-2px);
    }

    h1 {
      font-size: 28px;
      color: #102a43;
      flex: 1;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 2px solid #e0e7ef;
      border-radius: 8px;
      font-size: 14px;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
    }

    .sort-select {
      padding: 10px 16px;
      border: 2px solid #e0e7ef;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .sort-select:focus {
      outline: none;
      border-color: #667eea;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #f8fafc;
      border: 2px solid #e0e7ef;
      border-radius: 8px;
      font-size: 14px;
      color: #334e68;
      cursor: pointer;
    }

    .toggle input {
      width: 16px;
      height: 16px;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      padding: 16px;
      background: #f6f8fb;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 12px;
      color: #52606d;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #102a43;
    }

    .words-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }

    .word-card {
      background: white;
      border: 2px solid #e0e7ef;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .word-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      border-color: #667eea;
    }

    .word-card.mastered {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-color: #10b981;
    }

    .mastered-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 8px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
    }

    .word-text {
      font-size: 24px;
      font-weight: 700;
      color: #102a43;
      margin-bottom: 8px;
      text-align: center;
    }

    .word-phonetic {
      font-size: 12px;
      color: #829ab1;
      margin-bottom: 12px;
      text-align: center;
    }

    .word-translation {
      font-size: 14px;
      color: #243b53;
      line-height: 1.6;
      text-align: center;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .pagination button {
      padding: 10px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination-info {
      color: #52606d;
      font-size: 14px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: #f1f5f9;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: #52606d;
    }

    .modal-close:hover {
      background: #e2e8f0;
    }

    .modal-word {
      font-size: 36px;
      font-weight: 700;
      color: #102a43;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .speak-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .speak-btn:hover {
      transform: scale(1.05);
    }

    .mastered-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      margin-left: 8px;
    }

    .mastered-btn.unmastered {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .mastered-btn:hover {
      transform: scale(1.05);
    }

    .add-vocabulary-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      margin-left: 8px;
    }

    .add-vocabulary-btn:hover {
      transform: scale(1.05);
    }

    .add-vocabulary-btn.added {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      cursor: default;
    }

    .modal-phonetic {
      font-size: 14px;
      color: #829ab1;
      margin-bottom: 20px;
    }

    .modal-section {
      margin-bottom: 20px;
    }

    .modal-section-title {
      font-size: 12px;
      font-weight: 600;
      color: #52606d;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-translation {
      font-size: 16px;
      color: #243b53;
      line-height: 1.8;
    }

    .modal-sentences {
      list-style: none;
    }

    .modal-sentences li {
      padding: 12px;
      background: #f6f8fb;
      border-radius: 8px;
      margin-bottom: 8px;
      line-height: 1.6;
      color: #52606d;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #52606d;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #829ab1;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-btn">← 返回</a>
      <h1 id="categoryName">词汇列表</h1>
    </header>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索单词...">
      <select class="sort-select" id="sortSelect">
        <option value="">默认顺序</option>
        <option value="alpha">字母 A-Z</option>
        <option value="alpha-reverse">字母 Z-A</option>
        <option value="views-desc">查看次数多 → 少</option>
        <option value="views-asc">查看次数少 → 多</option>
        <option value="fetch-desc">获取次数多 → 少</option>
        <option value="fetch-asc">获取次数少 → 多</option>
        <option value="len-desc">字长 长 → 短</option>
        <option value="len-asc">字长 短 → 长</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="hideMastered">
        隐藏已掌握
      </label>
      <button id="filterTagsBtn" class="toggle" style="margin: 0;">
        🏷️ 排除标签
      </button>
    </div>

    <!-- 排除标签弹窗 -->
    <div id="filterTagsModal" class="modal">
      <div class="modal-content" style="max-width: 500px;">
        <button class="modal-close" onclick="closeFilterTagsModal()">×</button>
        <div style="padding: 20px;">
          <h3 style="margin-bottom: 16px; color: #102a43;">排除标签</h3>
          <div id="filterTagsContainer" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
          <button onclick="closeFilterTagsModal()" style="margin-top: 16px; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">确定</button>
        </div>
      </div>
    </div>

    <div id="content">
      <div class="loading">加载单词中...</div>
    </div>

    <div class="pagination" style="display:none;"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    const PAGE_SIZE = 12;

    let words = [];
    let total = 0;
    let currentPage = 0; // 0-based page index
    let hasMore = true;
    let loading = false;

    let currentTag = '';
    let currentSort = '';
    let hideMastered = false;
    let searchText = '';
    let excludeTags = [];

    const urlParams = new URLSearchParams(window.location.search);
    currentTag = urlParams.get('tag') || '';

    function getHideKey() {
      return `categoryHideMastered:${currentTag || 'all'}`;
    }

    function getExcludeTagsKey() {
      return `categoryExcludeTags:${currentTag || 'all'}`;
    }

    // 从 localStorage 读取已保存的排除标签
    function loadExcludeTagsFromStorage() {
      const key = getExcludeTagsKey();
      const saved = localStorage.getItem(key);
      if (saved) {
        try {
          excludeTags = JSON.parse(saved);
        } catch (e) {
          excludeTags = [];
        }
      }
    }

    // 保存排除标签到 localStorage
    function saveExcludeTagsToStorage() {
      const key = getExcludeTagsKey();
      localStorage.setItem(key, JSON.stringify(excludeTags));
    }

    function mapSort(value) {
      // 前端下拉 -> 后端 sort 值
      if (value === 'views-desc') return 'views-desc';
      if (value === 'views-asc') return 'views-asc';
      if (value === 'fetch-desc') return 'fetch-desc';
      if (value === 'fetch-asc') return 'fetch-asc';
      if (value === 'alpha') return 'alpha';
      if (value === 'alpha-reverse') return 'alpha-reverse';
      if (value === 'len-desc') return 'length-desc';
      if (value === 'len-asc') return 'length-asc';
      return null;
    }

    async function loadWords(targetPage = 0, reset = false) {
      try {
        if (loading) return;

        // 初次或重置时清空并显示加载
        if (reset) {
          currentPage = 0;
          words = [];
          total = 0;
          hasMore = true;
          document.getElementById('content').innerHTML = '<div class="loading">加载单词中...</div>';
        }

        if (!hasMore && !reset) return;
        loading = true;

        // 读取隐藏已掌握偏好
        hideMastered = localStorage.getItem(getHideKey()) === '1';
        const hideCheckbox = document.getElementById('hideMastered');
        if (hideCheckbox) hideCheckbox.checked = hideMastered;

        // 加载分类统计（只在重置时请求一次即可）
        if (reset || document.getElementById('stats').innerHTML.trim() === '') {
          const statsRes = await fetch(`${API_BASE}/mastered-stats/${currentTag}`);
          const stats = await statsRes.json();
          document.getElementById('categoryName').textContent = currentTag || '所有词汇';
          document.getElementById('stats').innerHTML = `
            <div class="stat-item">
              <div class="stat-label">总词汇数</div>
              <div class="stat-value">${stats.total}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">已掌握</div>
              <div class="stat-value">${stats.mastered}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">掌握进度</div>
              <div class="stat-value">${stats.progress}%</div>
            </div>
          `;
        }

        const pageToLoad = reset ? 0 : Math.max(0, targetPage);

        const body = {
          tags: currentTag ? [currentTag] : [],
          skip: pageToLoad * PAGE_SIZE,
          limit: PAGE_SIZE,
          search: searchText || null,
          sort: mapSort(currentSort),
          hideMastered,
          excludeTags
        };

        const response = await fetch(`${API_BASE}/vocabulary`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const result = await response.json();
        const data = result.data || [];
        total = result.total || 0;

        // 替换式翻页：每次获取一页覆盖列表
        words = data;
        currentPage = pageToLoad;
        hasMore = (currentPage + 1) * PAGE_SIZE < total;

        renderWords();
      } catch (error) {
        console.error('加载单词失败:', error);
        document.getElementById('content').innerHTML = '<div class="empty">❌ 加载失败</div>';
      } finally {
        loading = false;
      }
    }

    function renderWords() {
      const content = document.getElementById('content');

      if (!words.length) {
        content.innerHTML = '<div class="empty">暂无单词</div>';
        updatePaginationUI();
        return;
      }

      const html = words.map(word => {
        const mastered = word.status === 'mastered' ? ' mastered' : '';
        const badge = word.status === 'mastered' ? '<div class="mastered-badge">✓ 已掌握</div>' : '';
        const viewCount = word.wordViewCount || 0;
        const fetchCount = word.wordFetchesCount || 0;
        return `
          <div class="word-card${mastered}" data-word='${JSON.stringify(word).replace(/'/g, "&#39;")}'>
            ${badge}
            <div class="word-text">${word.word}</div>
            <div class="word-translation">👁️ 查看：${viewCount} | 📋 获取：${fetchCount}</div>
          </div>
        `;
      }).join('');

      content.innerHTML = `<div class="words-grid">${html}</div>`;

      document.querySelectorAll('.word-card').forEach(card => {
        card.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const wordData = JSON.parse(card.getAttribute('data-word'));
          const isMastered = wordData.status === 'mastered';
          toggleMastered(wordData.word, !isMastered);
        });

        card.addEventListener('click', () => {
          const wordData = JSON.parse(card.getAttribute('data-word'));
          showModal(wordData);
          logWordView(wordData.word);
        });
      });

      content.scrollTop = 0;
      updatePaginationUI();
    }

    function updatePaginationUI() {
      const pagination = document.querySelector('.pagination');
      if (!pagination) return;

      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const prevDisabled = currentPage <= 0;
      const nextDisabled = currentPage >= totalPages - 1;

      pagination.style.display = 'flex';
      pagination.innerHTML = `
        <button ${prevDisabled ? 'disabled' : ''}>上一页</button>
        <span class="pagination-info">第 ${totalPages === 0 ? 0 : currentPage + 1} / ${totalPages} 页 (共 ${total} 个单词)</span>
        <button ${nextDisabled ? 'disabled' : ''}>下一页</button>
      `;

      const [prevBtn, , nextBtn] = pagination.children;
      if (prevBtn) {
        prevBtn.onclick = () => {
          if (!prevDisabled) loadWords(currentPage - 1, false);
        };
      }
      if (nextBtn) {
        nextBtn.onclick = () => {
          if (!nextDisabled) loadWords(currentPage + 1, false);
        };
      }
    }

    function showModal(word) {
      const translations = Array.isArray(word.translations)
        ? word.translations.map(t => {
            if (typeof t === 'string') return t;
            return `${t.type ? `[${t.type}] ` : ''}${t.translation || ''}`;
          }).filter(Boolean).join('<br>')
        : '';

      const sentences = Array.isArray(word.sentences) ? word.sentences.slice(0, 5) : [];
      const sentencesHtml = sentences.length
        ? `<ul class="modal-sentences">${sentences.map(s => `
            <li>
              <strong>EN:</strong> ${escapeHtml(s.sentence || '')}<br>
              <strong>CN:</strong> ${escapeHtml(s.translation || '')}
            </li>
          `).join('')}</ul>`
        : '<p style="color: #829ab1;">暂无例句</p>';

      const masteredBtn = word.status === 'mastered'
        ? `<button class="mastered-btn unmastered" onclick="toggleMastered('${word.word}', false)">取消掌握</button>`
        : `<button class="mastered-btn" onclick="toggleMastered('${word.word}', true)">✓ 标记掌握</button>`;

      const addVocabularyBtn = `<button class="add-vocabulary-btn" onclick="addToVocabulary('${escapeHtml(word.word)}')">📚 加入生词本</button>`;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-word">
          <span>${escapeHtml(word.word)}</span>
          <button class="speak-btn" onclick="speak('${escapeHtml(word.word)}')">🔊 发音</button>
          ${masteredBtn}
          ${addVocabularyBtn}
        </div>
        ${word.us ? `<div class="modal-phonetic">🇺🇸 ${escapeHtml(word.us)}</div>` : ''}
        ${word.uk ? `<div class="modal-phonetic">🇬🇧 ${escapeHtml(word.uk)}</div>` : ''}
        
        ${translations ? `
          <div class="modal-section">
            <div class="modal-section-title">释义</div>
            <div class="modal-translation">${translations}</div>
          </div>
        ` : ''}
        
        <div class="modal-section">
          <div class="modal-section-title">例句</div>
          ${sentencesHtml}
        </div>
      `;

      document.getElementById('modal').classList.add('open');
      speak(word.word);
    }

    async function toggleMastered(word, isMastered) {
      try {
        const response = await fetch(`${API_BASE}/word-mastered`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ word, isMastered })
        });

        if (response.ok) {
          // 关闭弹窗并刷新列表（后端排序分页）
          document.getElementById('modal').classList.remove('open');
          loadWords(currentPage, false);
        }
      } catch (error) {
        console.error('更新掌握状态失败:', error);
      }
    }

    async function logWordView(word) {
      try {
        await fetch(`${API_BASE}/search-word?word=${encodeURIComponent(word)}`);
      } catch (err) {
        console.warn('记录查看失败:', err);
      }
    }

    async function addToVocabulary(word) {
      try {
        const btn = event.target;
        if (btn.classList.contains('added')) return;

        // 先获取单词的完整信息
        const response = await fetch(`${API_BASE}/search-word?word=${encodeURIComponent(word)}`);
        const result = await response.json();

        if (!result.found) {
          alert('单词信息获取失败');
          return;
        }

        const wordData = result.data;

        // 调用添加到生词本接口
        const addResponse = await fetch(`${API_BASE}/custom-words`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            word: wordData.word,
            us: wordData.us,
            uk: wordData.uk,
            translations: wordData.translations,
            sentences: wordData.sentences || [],
            phrases: wordData.phrases || [],
            source: 'category-page',
            captureDate: new Date().toISOString(),
            isCustom: true
          })
        });

        const addResult = await addResponse.json();

        if (addResult.ok) {
          btn.textContent = '✓ 已加入';
          btn.classList.add('added');
          
          // 2秒后恢复
          setTimeout(() => {
            btn.textContent = '📚 加入生词本';
            btn.classList.remove('added');
          }, 2000);
        } else {
          alert('添加失败：' + (addResult.error || '未知错误'));
        }
      } catch (error) {
        console.error('添加到生词本失败:', error);
        alert('添加失败，请重试');
      }
    }

    let voiceCache = [];
    let voicesPromise;

    function ensureVoices() {
      if (!('speechSynthesis' in window)) return Promise.resolve([]);
      if (voicesPromise) return voicesPromise;

      voicesPromise = new Promise((resolve) => {
        const load = () => {
          const voices = window.speechSynthesis.getVoices();
          if (voices && voices.length) {
            voiceCache = voices;
            resolve(voices);
            return;
          }
          setTimeout(load, 200);
        };
        window.speechSynthesis.onvoiceschanged = load;
        load();
      });

      return voicesPromise;
    }

    async function speak(text) {
      if (!text || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      await ensureVoices();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;

      const enVoice = voiceCache.find(v => (v.lang || '').toLowerCase().startsWith('en'));
      if (enVoice) utterance.voice = enVoice;

      window.speechSynthesis.speak(utterance);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // 防护函数
    function debounce(func, delay = 300) {
      let timeoutId;
      return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(this, args), delay);
      };
    }

    // 加载并渲染排除标签选择器
    async function loadFilterTags() {
      try {
        const response = await fetch(`${API_BASE}/tags`);
        const result = await response.json();
        
        // 处理不同的响应格式：可能是 { tags: [...] } 或直接是数组
        const allTags = (result && result.tags) || result || [];
        
        const container = document.getElementById('filterTagsContainer');
        
        if (!allTags || allTags.length === 0) {
          container.innerHTML = '<p style="color: #829ab1;">暂无标签</p>';
          return;
        }
        
        // 对标签进行分组
        const grouped = groupTags(allTags);
        
        let html = '';
        for (const [groupName, tags] of Object.entries(grouped)) {
          html += `
            <div style="width: 100%; margin-bottom: 16px;">
              <div style="font-size: 12px; font-weight: 600; color: #667eea; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">${groupName}</div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                ${tags.map(tag => `
                  <label style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f0f0f0; border-radius: 6px; cursor: pointer; user-select: none; font-size: 14px;">
                    <input type="checkbox" class="exclude-tag-checkbox" value="${tag}" ${excludeTags.includes(tag) ? 'checked' : ''}>
                    ${tag}
                  </label>
                `).join('')}
              </div>
            </div>
          `;
        }
        
        container.innerHTML = html;

        document.querySelectorAll('.exclude-tag-checkbox').forEach(checkbox => {
          checkbox.addEventListener('change', (e) => {
            const tag = e.target.value;
            if (e.target.checked) {
              if (!excludeTags.includes(tag)) excludeTags.push(tag);
            } else {
              excludeTags = excludeTags.filter(t => t !== tag);
            }
            saveExcludeTagsToStorage();
          });
        });
      } catch (error) {
        console.error('加载标签失败:', error);
        document.getElementById('filterTagsContainer').innerHTML = '<p style="color: #e74c3c;">加载标签失败</p>';
      }
    }

    // 标签分组函数
    function groupTags(tags) {
      const groups = {
        '学习相关': [],
        '考试标准': [],
        '教学阶段': [],
        '其他': []
      };

      const examKeywords = ['CET', 'IELTS', 'TOEFL', 'GMAT', 'GRE', 'KaoYan'];
      const educationKeywords = ['ChuZhong', 'GaoZhong', 'BeiShi', 'gaozhong', 'chuzhong'];

      tags.forEach(tag => {
        if (tag === 'learning' || tag === 'vocabulary') {
          groups['学习相关'].push(tag);
        } else if (examKeywords.some(kw => tag.toUpperCase().includes(kw.toUpperCase()))) {
          groups['考试标准'].push(tag);
        } else if (educationKeywords.some(kw => tag.includes(kw))) {
          groups['教学阶段'].push(tag);
        } else {
          groups['其他'].push(tag);
        }
      });

      // 移除空组
      const result = {};
      Object.entries(groups).forEach(([name, tags]) => {
        if (tags.length > 0) {
          result[name] = tags.sort();
        }
      });

      return result;
    }

    function openFilterTagsModal() {
      loadFilterTags();
      document.getElementById('filterTagsModal').classList.add('open');
    }

    function closeFilterTagsModal() {
      document.getElementById('filterTagsModal').classList.remove('open');
      loadWords(0, true); // 刷新列表
    }

    // 事件监吅
    const debouncedSearch = debounce(() => {
      loadWords(0, true);
    }, 300);

    document.getElementById('searchBox').addEventListener('input', (e) => {
      searchText = e.target.value.trim();
      debouncedSearch();
    });
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      loadWords(0, true); // 重置到第一页
    });
    document.getElementById('hideMastered').addEventListener('change', (e) => {
      hideMastered = e.target.checked;
      localStorage.setItem(getHideKey(), hideMastered ? '1' : '0');
      loadWords(0, true); // 重置到第一页
    });
    document.getElementById('filterTagsBtn').addEventListener('click', openFilterTagsModal);
    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('open');
    });
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) {
        document.getElementById('modal').classList.remove('open');
      }
    });
    document.getElementById('filterTagsModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('filterTagsModal')) {
        closeFilterTagsModal();
      }
    });

    // 初始化
    loadExcludeTagsFromStorage();
    loadWords(0, true);
  </script>
</body>
</html>
